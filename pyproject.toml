[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mxframe"
version = "0.6.0"
# F-165: the distribution is still called `mxframe` (the PyPI name is the owner's call). It installs two import names:
# `omxcore` (the engine) and `mxframe` (a forwarding module, compat/mxframe/, kept for one release).
description = "omxcore: a compute engine (CPU and GPU) with persistence to open Parquet files. Python package with Mojo AOT kernels."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Abhishek Sreesaila", email = "abhisheksreesaila@users.noreply.github.com" },
]
keywords = ["dataframe", "gpu", "mojo", "arrow", "analytics", "tpch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pyarrow>=14.0",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
# `modular` provides the MAX engine & driver used by mxframe's compiler.
# It lives on PyPI *and* in Modular's conda channel. Pixi users get it from conda
# and should NOT install this extra (it will conflict). Pure-pip users should:
#   pip install "mxframe[runtime]"
runtime = ["modular>=26.6"]
polars  = ["polars>=0.20"]
sql     = ["sqlglot>=25.0"]
dev     = [
    "build>=1.2",
    "pytest>=7.0",
    "polars>=0.20",
    "sqlglot>=25.0",
    "duckdb>=0.9",
    "twine>=6.0",
]

[project.urls]
Homepage   = "https://github.com/abhisheksreesaila/omxcore"
Repository = "https://github.com/abhisheksreesaila/omxcore"

[tool.setuptools]
# Declare the root package explicitly so setuptools does not treat docs/, scripts/
# and llm-ctx/ as implicit namespace packages. The repo root is `omxcore`; `mxframe` is the forwarding module.
package-dir = { "omxcore" = ".", "mxframe" = "compat/mxframe" }
packages = ["omxcore", "omxcore.kernels_aot", "mxframe"]

[tool.setuptools.package-data]
# Ship the pre-compiled AOT .so files and the Mojo package.
"omxcore" = [
    "kernels.mojoc",
]
"omxcore.kernels_aot" = ["*.so"]

