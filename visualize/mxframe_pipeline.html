<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MXFrame — Query to GPU Kernel</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0b0d14;
      color: #e2e8f0;
      min-height: 100vh;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    /* Neon glow helpers */
    .glow-green { box-shadow: 0 0 12px rgba(0,255,136,0.35); }
    .glow-blue  { box-shadow: 0 0 12px rgba(56,189,248,0.35); }
    .glow-orange{ box-shadow: 0 0 12px rgba(251,146,60,0.35); }
    .glow-purple{ box-shadow: 0 0 12px rgba(167,139,250,0.35); }

    /* Token colours for the code panel */
    .tok-kw   { color:#c792ea; }
    .tok-fn   { color:#82aaff; }
    .tok-str  { color:#c3e88d; }
    .tok-num  { color:#f78c6c; }
    .tok-col  { color:#89ddff; }
    .tok-op   { color:#89ddff; }
    .tok-cm   { color:#546e7a; font-style:italic; }
    .tok-alias{ color:#ffcb6b; }

    /* animated underline on active code line */
    @keyframes slideIn {
      from { opacity:0; transform:translateX(-8px); }
      to   { opacity:1; transform:translateX(0); }
    }
    .line-enter { animation: slideIn 0.3s ease forwards; }

    /* Plan tree node pulse */
    @keyframes nodePop {
      0%  { transform:scale(0.7); opacity:0; }
      60% { transform:scale(1.08); }
      100%{ transform:scale(1);   opacity:1; }
    }
    .node-enter { animation: nodePop 0.4s ease forwards; }

    /* GPU thread flash */
    @keyframes threadFire {
      0%  { background:#111; color:#555; }
      50% { background:#00ff88; color:#000; box-shadow:0 0 8px #00ff88; }
      100%{ background:#1a3d28; color:#00ff88; }
    }
    .thread-fire { animation: threadFire 0.5s ease forwards; }
    @keyframes threadFade {
      from { opacity:1; } to { opacity:0.25; }
    }

    /* Dispatch ribbon */
    @keyframes arrowSlide {
      from { width:0; opacity:0; }
      to   { opacity:1; }

// ─── Tree layout helper ────────────────────────────────────────────────────
function buildTree(nodes) {
  const map = {};
  nodes.forEach(n => { map[n.id] = {...n, _children: n.children.map(c => map[c] || null).filter(Boolean)}; });
  // Find root (not referenced as child of anything)
  const childIds = new Set(nodes.flatMap(n => n.children));
  return nodes.find(n => !childIds.has(n.id));
}

// ─── Components ───────────────────────────────────────────────────────────

function CodePanel({ lines, visibleCount }) {
  return (
    <div className="mono" style={{
      background:"#161b22", borderRadius:10, padding:"16px 18px",
      fontSize:13, lineHeight:"1.9", height:"100%", overflow:"auto",
      border:"1px solid #30363d"
    }}>
      <div style={{color:"#8b949e",fontSize:11,marginBottom:10,letterSpacing:1}}>
        PYTHON · LazyFrame API
      </div>
      {lines.map((l, i) => (
        <div key={i} className={i < visibleCount ? "line-enter" : ""}
          style={{
            opacity: i < visibleCount ? 1 : 0.12,
            background: i === visibleCount-1 && visibleCount > 0
              ? "rgba(0,255,136,0.06)" : "transparent",
            borderLeft: i === visibleCount-1 && visibleCount > 0
              ? "2px solid #00ff88" : "2px solid transparent",
            paddingLeft: 8, borderRadius: 3, transition:"opacity 0.3s"
          }}>
          <span className={l.cls} dangerouslySetInnerHTML={{
            __html: l.extra ? l.txt.replace(")", "") + l.extra : escapeHtml(l.txt)
          }} />
        </div>
      ))}
    </div>
  );
}

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// Recursive tree renderer
function TreeNode({ node, nodeMap, visibleIds, depth=0 }) {
  if (!node) return null;
  const visible = visibleIds.has(node.id);
  const nodeColor = node.color;
  return (
    <div style={{ display:"flex", flexDirection:"column", alignItems:"center", minWidth:90 }}>
      <div className={visible ? "node-enter" : ""}
        style={{
          opacity: visible ? 1 : 0,
          background: visible ? nodeColor+"22" : "transparent",
          border: `2px solid ${visible ? nodeColor : "#333"}`,
          borderRadius: 8,
          padding: "6px 12px",
          textAlign:"center",
          fontSize: 12,
          minWidth: 80,
          position:"relative",
          transition:"border-color 0.3s",
          boxShadow: visible ? `0 0 10px ${nodeColor}44` : "none"
        }}>
        <div style={{fontSize:18, marginBottom:2}}>{node.icon}</div>
        <div style={{fontWeight:700, color: nodeColor, fontSize:11}}>{node.label}</div>
        {visible && (
          <div style={{
            fontSize:9.5, color:"#94a3b8", marginTop:3, whiteSpace:"pre-line",
            fontFamily:"'JetBrains Mono', monospace"
          }}>{node.detail}</div>
        )}
      </div>
      {node._children && node._children.length > 0 && (
        <>
          <div style={{width:2,height:18,background:"#334155"}} />
          <div style={{display:"flex", gap:12, alignItems:"flex-start"}}>
            {node._children.map((child, ci) => (
              <div key={ci} style={{display:"flex", flexDirection:"column", alignItems:"center"}}>
                {node._children.length > 1 && (
                  <div style={{width:"100%",height:2,background:"#334155",marginBottom:0}} />
                )}
                <TreeNode node={child} nodeMap={nodeMap} visibleIds={visibleIds} depth={depth+1} />
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function TreePanel({ query, visibleNodeIds }) {
  const nodeMap = {};
  query.tree.forEach(n => nodeMap[n.id] = n);
  query.tree.forEach(n => n._children = n.children.map(c=>nodeMap[c]).filter(Boolean));
  const childIds = new Set(query.tree.flatMap(n=>n.children));
  const root = query.tree.find(n => !childIds.has(n.id));
  const visSet = new Set(visibleNodeIds);
  return (
    <div style={{
      background:"#161b22", borderRadius:10, padding:"16px 12px",
      border:"1px solid #30363d", height:"100%", overflow:"auto",
      display:"flex", flexDirection:"column", alignItems:"center"
    }}>
      <div style={{color:"#8b949e",fontSize:11,marginBottom:14,letterSpacing:1,alignSelf:"flex-start"}}>
        LOGICAL PLAN TREE
      </div>
      <div style={{display:"flex", justifyContent:"center", flex:1, paddingTop:8}}>
        <TreeNode node={root} nodeMap={nodeMap} visibleIds={visSet} />
      </div>
    </div>
  );
}

function DispatchPanel({ dispatch, visibleCount, provenance }) {
  return (
    <div style={{
      background:"#161b22", borderRadius:10, padding:"16px 14px",
      border:"1px solid #30363d", height:"100%", overflow:"auto"
    }}>
      <div style={{color:"#8b949e",fontSize:11,marginBottom:14,letterSpacing:1}}>
        DISPATCH PIPELINE
      </div>
      {dispatch.map((d,i) => {
        const active = i < visibleCount;
        return (
          <div key={i} style={{
            display:"flex", alignItems:"flex-start", gap:10, marginBottom:10,
            opacity: active ? 1 : 0.1, transition:"opacity 0.4s"
          }}>
            <div style={{
              width:10, height:10, borderRadius:"50%", marginTop:4, flexShrink:0,
              background: active ? d.color : "#333",
              boxShadow: active ? `0 0 8px ${d.color}` : "none",
              transition:"all 0.4s"
            }} />
            <div>
              <div style={{
                fontSize:12, fontWeight:600, color: active ? d.color : "#444",
                fontFamily:"'JetBrains Mono', monospace"
              }}>{d.label}</div>
              <div style={{fontSize:10, color:"#64748b", margin:"2px 0"}}>{d.where}</div>
              <div style={{fontSize:10, color:"#94a3b8", fontStyle:"italic"}}>{d.note}</div>
            </div>
          </div>
        );
      })}
      {visibleCount >= dispatch.length && (
        <div style={{
          marginTop:14, padding:"8px 12px", borderRadius:6,
          background:"rgba(0,255,136,0.07)", border:"1px solid #00ff8855",
          fontSize:11, color:"#00ff88", fontFamily:"'JetBrains Mono',monospace"
        }}>
          provenance: <strong>{provenance}</strong>
        </div>
      )}
    </div>
  );
}

// ─── Algorithm visualizations (one per query) ────────────────────────────

// GROUP_SUM — scatter to 6 shared-memory bins (Q1)
function GroupSumViz({ sub }) {
  const COLS = ["#00ff88","#38bdf8","#f59e0b","#a78bfa","#fb923c","#f472b6"];

  const data = [
    {v:2.1,g:0},{v:3.2,g:1},{v:1.5,g:2},{v:3.8,g:3},{v:1.9,g:4},{v:4.1,g:5},
    {v:4.3,g:0},{v:2.9,g:1},{v:4.7,g:2},{v:2.1,g:3},{v:3.3,g:4},{v:1.6,g:5},

// ─── Step definitions ──────────────────────────────────────────────────────
function getSteps(qid) {
  const q = QUERIES[qid];
  const nodeIds = q.tree.map(n=>n.id);
  const allNodeIds = [...nodeIds];
  // Build reveal order: leaves first (bottom of tree), then up
  const childOf = {};
  q.tree.forEach(n=>{
    n.children.forEach(c=>{ childOf[c] = n.id; });
  });
  const orphans = q.tree.filter(n=>!q.tree.some(m=>m.children.includes(n.id)));
  const order = [];
  function addOrder(id) {
    const node = q.tree.find(n=>n.id===id);
    if (!node) return;
    node.children.forEach(addOrder);
    if (!order.includes(id)) order.push(id);
  }
  if (orphans.length) addOrder(orphans[0].id);
  else order.push(...nodeIds);

  return [
    {
      label:"The Query",
      desc:"You write a Polars-style lazy DataFrame API. No SQL, no schema declarations — MXFrame infers the plan.",
      code: 0,                // show no lines yet (act as intro)
      nodeIds: [],
      dispatchCount: 0,
      kernelActive: false,
    },
    {
      label:"Python API → Code",
      desc:"Each method call adds a node to the lazy plan. Nothing executes yet — it's just building a tree description of intent.",
      code: q.code.length,
      nodeIds: [],
      dispatchCount: 0,
      kernelActive: false,
    },
    ...order.map((id,i)=>({
      label:`Plan node: ${q.tree.find(n=>n.id===id)?.label}`,
      desc: `${q.tree.find(n=>n.id===id)?.label}: ${q.tree.find(n=>n.id===id)?.detail?.split("\n")[0]}`,
      code: q.code.length,
      nodeIds: order.slice(0, i+1),
      dispatchCount: 0,
      kernelActive: false,
    })),
    {
      label:"Optimizer",
      desc:`Optimizer passes: ${q.optimizer.passes.join(" | ")}. ${q.optimizer.note}.`,
      code: q.code.length,
      nodeIds: allNodeIds,
      dispatchCount: 0,
      kernelActive: false,
    },
    ...q.dispatch.map((_,i)=>({
      label:`Dispatch: ${q.dispatch[i].label}`,
      desc: q.dispatch[i].note,
      code: q.code.length,
      nodeIds: allNodeIds,
      dispatchCount: i+1,
      kernelActive: false,
    })),
    {
      label:"Mojo GPU Kernel fires 🔥",
      desc:`${q.kernel.name} — ${q.kernel.N.toLocaleString()} input rows, ${q.kernel.groups||1} output group${q.kernel.groups!==1?"s":""}. Watch the threads light up!`,
      code: q.code.length,
      nodeIds: allNodeIds,
      dispatchCount: q.dispatch.length,
      kernelActive: true,
    },
    {
      label:"Result in Python",
      desc:`Done! ${q.result.rows} row${q.result.rows!==1?"s":""} returned as a PyArrow table. MXFrame did the heavy lifting on GPU.`,
      code: q.code.length,
      nodeIds: allNodeIds,
      dispatchCount: q.dispatch.length,
      kernelActive: true,
    },
  ];
}

      {/* ── Header ── */}
      <div style={{
        background:"#0d1117", borderBottom:"1px solid #21262d",
        padding:"14px 28px", display:"flex", alignItems:"center", gap:20, flexWrap:"wrap"
      }}>
        <div>
          <span style={{fontWeight:900, fontSize:20, color:"#00ff88", letterSpacing:1}}>
            MXFrame
          </span>
          <span style={{fontSize:13, color:"#8b949e", marginLeft:10}}>
            Query → Logical Plan → GPU Kernel
          </span>
        </div>
        <div style={{display:"flex", gap:8, flexWrap:"wrap", marginLeft:"auto"}}>
          {Object.entries(QUERIES).map(([id,q])=>(
            <button key={id} onClick={()=>changeQuery(id)} style={{
              padding:"6px 14px", borderRadius:20, fontSize:12, cursor:"pointer",
              border:`1.5px solid ${qid===id?"#00ff88":"#30363d"}`,
              background: qid===id?"rgba(0,255,136,0.12)":"transparent",
              color: qid===id?"#00ff88":"#8b949e",
              fontWeight: qid===id?700:400, transition:"all 0.2s"
            }}>
              {q.emoji} {id}
            </button>
          ))}
        </div>
      </div>

      {/* ── Query subtitle ── */}
      <div style={{
        padding:"10px 28px", background:"#111827", borderBottom:"1px solid #1e293b",
        fontSize:12, color:"#94a3b8"
      }}>
        <span style={{color:"#e2e8f0", fontWeight:600}}>{q.label}</span>
        <span style={{marginLeft:10}}>{q.subtitle}</span>
      </div>

      {/* ── Three-column layout ── */}
      <div style={{
        flex:1, display:"grid",
        gridTemplateColumns:"1fr 1fr 1fr 1fr",
        gap:12, padding:"12px 16px",
        minHeight:0
      }}>
        {/* Code */}
        <div style={{gridColumn:"1/2", minHeight:480}}>
          <CodePanel lines={q.code} visibleCount={cur.code || 0} />
        </div>
        {/* Plan tree */}
        <div style={{gridColumn:"2/3", minHeight:480}}>
          <TreePanel query={q} visibleNodeIds={cur.nodeIds||[]} />
        </div>
        {/* Dispatch */}
        <div style={{gridColumn:"3/4", minHeight:480}}>
          <DispatchPanel
            dispatch={q.dispatch}
            visibleCount={cur.dispatchCount||0}
            provenance={q.provenance}
          />
        </div>
        {/* Kernel */}
        <div style={{gridColumn:"4/5", minHeight:480}}>
          <KernelPanel
            qid={qid}
            kernel={q.kernel}
            active={cur.kernelActive||false}
            resultRows={q.result.rows}
            resultCols={q.result.cols}
          />
        </div>
      </div>

      {/* ── Step status bar + controls ── */}
      <div style={{
        background:"#0d1117", borderTop:"1px solid #21262d",
        padding:"12px 28px", display:"flex", alignItems:"center", gap:16, flexWrap:"wrap"
      }}>
        {/* Progress dots */}
        <div style={{display:"flex", gap:5, alignItems:"center"}}>
          {steps.map((_,i)=>(
            <div key={i}
              onClick={()=>setStep(i)}
              style={{
                width: i===step ? 22 : 7,
                height:7, borderRadius:4, cursor:"pointer",
                background: i<step?"#1a5c3a" : i===step?"#00ff88":"#1e293b",
                transition:"all 0.3s"
              }}
            />
          ))}
        </div>

        {/* Step info */}
        <div style={{flex:1}}>
          <div style={{fontWeight:700, color:"#e2e8f0", fontSize:13}}>
            Step {step+1}/{steps.length} — {cur.label}
          </div>
          <div style={{fontSize:11, color:"#64748b", marginTop:2}}>{cur.desc}</div>
        </div>

        {/* Nav buttons */}
        <div style={{display:"flex", gap:10}}>
          <button onClick={()=>setStep(s=>Math.max(0,s-1))} disabled={step===0}
            style={{
              padding:"8px 22px", borderRadius:20, cursor:step===0?"default":"pointer",
              border:"1.5px solid #30363d", background:"transparent",
              color: step===0?"#334155":"#e2e8f0", fontWeight:600, fontSize:13
            }}>◀ Prev</button>
          <button onClick={()=>setStep(s=>Math.min(steps.length-1,s+1))} disabled={step===steps.length-1}
            style={{
              padding:"8px 22px", borderRadius:20, cursor:step===steps.length-1?"default":"pointer",
              border:`1.5px solid ${step===steps.length-1?"#1a5c3a":"#00ff88"}`,
              background: step===steps.length-1?"transparent":"rgba(0,255,136,0.12)",
              color: step===steps.length-1?"#1a5c3a":"#00ff88",
              fontWeight:700, fontSize:13
            }}>Next ▶</button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
